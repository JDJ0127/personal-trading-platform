[project]
name = "personal-trading-platform-backend"
version = "1.0.0rc1"
description = "Personal A-share quant trading platform for daily-bar strategy screening and paper trading."
requires-python = ">=3.9"
dependencies = [
  "akshare>=1.16.0",
  "baostock>=0.8.9",
  "efinance>=0.5.5",
  "mootdx>=0.11.7",
]

[project.scripts]
trading-platform = "trading_platform.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
